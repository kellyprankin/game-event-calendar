# Local development only; credentials are not secrets.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gameevent
      POSTGRES_USER: gameevent
      POSTGRES_PASSWORD: gameevent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameevent -d gameevent"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./GameEventApi
      dockerfile: GameEventApi/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=gameevent;Username=gameevent;Password=gameevent"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
